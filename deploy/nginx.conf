# nginx in front of the BowserAuto frontend container (docker compose --profile proxy).
#
# The frontend container already proxies /api and /mock-platform to the backend, so nginx only
# needs to forward everything to it while keeping WebSocket upgrades (live browser stream,
# event feed) and long-lived SSE connections alive. Terminate TLS here (or at your cloud LB)
# and set COOKIE_SECURE=true + PUBLIC_BASE_URL=https://… in .env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream bowserauto_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;            # reference uploads / take-over file uploads
    proxy_read_timeout 3600s;            # SSE + WebSocket streams
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_buffering off;                 # stream frames/events immediately

    # Security headers (the app sets CSP-compatible inline styles only).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location / {
        proxy_pass http://bowserauto_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Signed download URLs can be large video files: let them stream without buffering.
    location ~ ^/api/files/.*/(download|preview) {
        proxy_pass http://bowserauto_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_max_temp_file_size 0;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

